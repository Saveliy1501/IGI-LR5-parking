{% extends 'parking_app/base.html' %}

{% block content %}
<article class="card">
    <h1>{{ news.title }}</h1>
    
    {% if news.image %}
        <figure>
            <img src="{{ news.image.url }}" alt="{{ news.title }}" style="max-width:100%;">
            <figcaption>{{ news.title }}</figcaption>
        </figure>
    {% endif %}
    
    <p><strong>Дата публикации:</strong> <time datetime="{{ news.created_at|date:'Y-m-d' }}">{{ news.created_at|date:'d/m/Y H:i' }}</time></p>
    
    <hr>
    
    <p>{{ news.content }}</p>
    
    <a href="{% url 'news_list' %}" class="btn">← К списку новостей</a>
</article>
{% endblock %}
