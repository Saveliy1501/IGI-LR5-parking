{% extends 'parking_app/base.html' %}

{% block content %}
<h1>Регистрация</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
    <p><a href="{% url 'login' %}">Уже есть аккаунт? Войти</a></p>
</div>
{% endblock %}
