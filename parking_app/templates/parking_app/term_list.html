{% extends 'parking_app/base.html' %}

{% block content %}
<h1>Словарь терминов и понятий</h1>

{% for term in terms %}
    <details class="card">
        <summary>
            <strong>{{ term.term }}</strong>
            <small style="color:#666;">(добавлено: {{ term.added_date|date:'d/m/Y' }})</small>
        </summary>
        <p>{{ term.definition }}</p>
    </details>
{% empty %}
    <p>Терминов пока нет.</p>
{% endfor %}
{% endblock %}
