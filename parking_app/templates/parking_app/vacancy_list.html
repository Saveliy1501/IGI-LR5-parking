{% extends 'parking_app/base.html' %}

{% block content %}
<h1>Вакансии</h1>
{% for vacancy in vacancies %}
    <div class="card">
        <h3>{{ vacancy.title }}</h3>
        <p>{{ vacancy.description }}</p>
        <p>Зарплата: {{ vacancy.salary }}</p>
    </div>
{% empty %}
    <p>Вакансий пока нет.</p>
{% endfor %}
{% endblock %}
